<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Profil</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/coreFragmentStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/profileStyle.css}">	
	</head>
	<body>
		<!-- Main navigation -->
		<div th:replace="~{fragments/core-fragments :: menu}"></div>
		
		<!-- Profile settings -->
		<div class="content">
			<h1>Einstellungen</h1>
			
			<!-- Form for changing username and email -->
			<form th:action="@{/changeUserData}" method="post">
				<label>Benutzername: </label>
				<input type="text" name="user-field" th:value="${username}" required> <br>
				
				<label>Email: </label>
				<input type="email" name="email-field" th:value="${email}" required> <br>
				
				<button type="submit">User-Data ändern</button>
			</form>
			
			<!-- Link for changing the password -->
			<a th:href="@{/page/logIn/forgotPassword}">Passwort ändern</a>
			
			<!-- Display error messages -->
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
			
			<!-- Form for logging out -->
			<form th:action="@{/logout}" method="post">
				<button type="submit">Logout</button>
			</form>
		</div>
	</body>
</html>
