<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Modul</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/mainStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Module</h1>
			
			<input hidden id="rowData">
			
			<table id="main-table">
				<thead>
					<tr>
						<th hidden>Modul_ID</th>
						<th hidden>User_ID</th>
						<th>Modul</th>
						<th>Leistungspunkte</th>
						<th>Veranstaltungsarten</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="modul : ${module}" th:onclick="rowClicked(this)">
						<td hidden th:text="${modul.modul_id}"></td>
						<td hidden th:text="${modul.user_id}"></td>
						<td th:text="${modul.modulname}"></td>
						<td th:text="${modul.lp}"></td>
						<td>
							<ul>
								<li th:each="event : ${modul.eventTypes}" th:text="${event.description}">
							</ul>
						</td>
					</tr>
				</tbody>
			</table>
			
			<div class="data-handling-btn">
				<button type="button"
					onclick="window.open('/popup/insert?insertType=MODUL', '_blank', 'width=500,height=400')">
					<i class="bi bi-plus-circle"></i>
				</button>
				
				<button type="button"
					onclick="window.open('/popup/edit?editType=MODUL', '_blank', 'width=500,height=400')">
					<i class="bi bi-pencil"></i>
				</button>
				
				<button type="button" onclick="openDeletePopup()">
					<i class="bi bi-trash"></i>
				</button>
			</div>
		</div>
		
		<script th:src="@{/js/tableScripts/tablerow-action.js}"></script>
		<script th:src="@{/js/popup/popup-opening.js}"></script>
	</body>
</html>
