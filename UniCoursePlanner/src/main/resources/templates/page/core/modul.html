<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Modul</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/mainStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/modalStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/coreFragmentStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Module</h1>
			
			<input hidden id="data">
			
			<table id="main-table">
				<thead>
					<tr>
						<th hidden>Modul_ID</th>
						<th>Modul</th>
						<th>Leistungspunkte</th>
						<th>Veranstaltungsarten</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="modul : ${module}" th:onclick="rowClicked(this)">
						<td hidden th:text="${modul.modul_id}"></td>
						<td th:text="${modul.modulname}"></td>
						<td th:text="${modul.lp}"></td>
						<td>
							<ul>
								<li th:each="event : ${modul.eventTypes}" th:text="${event.description}">
							</ul>
						</td>
					</tr>
				</tbody>
			</table>
			
			<div id="modalOverlay" class="modal-overlay hidden">
				<div class="modal-window">
					
					<button type="button" class="modal-close" onclick="closeModal()">
						×
					</button>
					
					<div id="modalContent"></div>
				</div>
			</div>
			
			<div class="data-handling-btn">
				<button type="button" onclick="openModal('insert', 'MODUL', validateAtLeastOneCheckboxChecked)">
					<i class="bi bi-plus-circle"></i>
				</button>
				
				<button type="button" onclick="openModal('edit', 'MODUL')">
					<i class="bi bi-pencil"></i>
				</button>
				
				<button type="button" onclick="openModal('delete', 'MODUL')">
					<i class="bi bi-trash"></i>
				</button>
			</div>
			
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
		</div>
		
		<script th:src="@{/js/tableScripts/tablerow-action.js}"></script>
		<script th:src="@{/js/modulScripts/checkbox-required.js}"></script>
		<script th:src="@{/js/modal/modal-opening.js}"></script>
		<script th:src="@{/js/modal/modal-actions.js}"></script>
	</body>
</html>
