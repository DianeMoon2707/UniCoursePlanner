<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner LP</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/mainStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Leistungspunkte</h1>
			
			<input hidden id="rowData">
			
			<table id="main-table">
				<thead>
					<tr>
						<th hidden>Modul_ID</th>
						<th>Modul</th>
						<th>Leistungspunkte</th>
						<th>Note</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="modulnote : ${modulnoten}" th:onclick="rowClicked(this)">
						<td hidden th:text="${modulnote.modul_id}"></td>
						<td th:text="${modulnote.modulname}"></td>
						<td th:text="${modulnote.lp}"></td>
						<td th:text="${modulnote.grade ?: '-'}"></td>
					</tr>
				</tbody>
			</table>
			
			<p id="${lp_gesamt}">Leistungspunkte:</p>
			
			<div class="data-handling-btn">				
				<button type="button" onclick="openEditPopup()">
					<i class="bi bi-pencil"></i>
				</button>
			</div>
		</div>
		
		<script th:src="@{/js/tableScripts/tablerow-action.js}"></script>
		<script th:src="@{/js/popup/popup-opening.js}"></script>
	</body>
</html>
