<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner LP</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/mainStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/modalStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Leistungspunkte</h1>
			
			<input hidden id="data">
			
			<table id="main-table">
				<thead>
					<tr>
						<th hidden>Modul_ID</th>
						<th>Modul</th>
						<th>Leistungspunkte</th>
						<th>Note</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="modulnote : ${modulnoten}" th:onclick="rowClicked(this)">
						<td hidden th:text="${modulnote.modul_id}"></td>
						<td th:text="${modulnote.modulname}"></td>
						<td th:text="${modulnote.lp}"></td>
						<td th:text="${modulnote.grade?.numeric ?: '-'}"></td>
					</tr>
				</tbody>
			</table>
			
			<p>
			    Leistungspunkte:
			    <span th:text="${lp_gesamt}"></span>
			</p>
			
			<div id="modalOverlay" class="modal-overlay hidden">
				<div class="modal-window">
					<button type="button" class="modal-close" onclick="closeModal()">
						×
					</button>
					
					<div id="modalContent"></div>
				</div>
			</div>
			
			<div class="data-handling-btn">				
				<button type="button" onclick="openModal('edit', 'LEISTUNGSPUNKTE')">
					<i class="bi bi-pencil"></i>
				</button>
			</div>
			
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
		</div>
		
		<script th:src="@{/js/tableScripts/tablerow-action.js}"></script>
		<script th:src="@{/js/modal/modal-opening.js}"></script>
		<script th:src="@{/js/modal/modal-actions.js}"></script>
	</body>
</html>
