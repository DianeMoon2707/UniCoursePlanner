<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Stundenplan</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/mainStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/modalStyle.css}">
		<link rel="stylesheet" th:href="@{/css/coreFragmentStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Stundenplan</h1>
			
			<input hidden id="data">
								
			<div class="raster schedule"
				th:with="days=${T(com.uni_course_planner.constants.timetable.Weekday).values()}"
				th:style="'--cols:' + ${days.length}">
				<div class="raster-row">
					<div class="raster-head">Zeitslot</div>
					<div th:each="day : ${days}" class="raster-head" th:text="${day.description}"></div>
				</div>
					
				<div th:each="row : ${timetable}" class="raster-row">
					<div class="raster-cell">
						<div class="raster-entry" th:text="${row.slot.time}"></div>
					</div>
					
					<div class="raster-cell" th:each="cell, dayStat : ${row.lectures}">
						<div th:each="lecture : ${cell}" class="raster-entry" 
							th:data-weekday="${days[dayStat.index]}"
							th:data-time="${row.slot}"
							th:style="'background-color:' + ${lecture.event.hexColor}"
							th:onclick="entryClicked(this)">
							
							<span th:text="${lecture.modul}"></span>
							<span th:text="${lecture.event.description} + ';'"></span>
							<span th:text="'Raum: ' + ${lecture.room}"></span>
						</div>
					</div>
				</div>
			</div>
			
			<div id="modalOverlay" class="modal-overlay hidden">
				<div class="modal-window">
					
					<button type="button" class="modal-close" onclick="closeModal()">
						×
					</button>
					
					<div id="modalContent"></div>
				</div>
			</div>
			
			<div class="data-handling-btn">
				<button type="button" onclick="openModal('insert', 'STUNDENPLAN')">
					<i class="bi bi-plus-circle"></i>
				</button>
				
				<button type="button" onclick="openModal('edit', 'STUNDENPLAN')">
					<i class="bi bi-pencil"></i>
				</button>
				
				<button type="button" onclick="openModal('delete', 'STUNDENPLAN')">
					<i class="bi bi-trash"></i>
				</button>
			</div>
			
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
		</div>
		
		<script th:src="@{/js/tableScripts/tablecell-action.js}"></script>
		<script th:src="@{/js/modal/modal-opening.js}"></script>
		<script th:src="@{/js/modal/modal-actions.js}"></script>
	</body>
</html>
