<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Profil</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/coreFragmentStyle.css}">	
		<link rel="stylesheet" th:href="@{/css/profileStyle.css}">	
	</head>
	<body>
		<div th:replace="~{fragments/core-fragments :: menue}"></div>
		
		<div class="content">
			<h1>Einstellungen</h1>
			
			<form th:action="@{/changeUserData}" method="post">
				<label>Benutzername: </label>
				<input type="text" name="user-field" th:value="${username}"> <br>
				
				<label>Email: </label>
				<input type="text" name="email-field" th:value="${email}"> <br>
				
				<button type="submit">User-Data ändern</button>
			</form>
			
			<a th:href="@{/page/logIn/passwortVergessen}">Passwort ändern</a>
			
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
			
			<form th:action="@{/logout}" method="post">
				<button type="submit">Logout</button>
			</form>
		</div>
		
		<script th:src="@{/js/logInScripts/password-eye-script.js}"></script>
	</body>
</html>
