<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="css/logIn/logInStyle.css">
	</head>
	<body>
		<div class="logInContainer">
			<h1>LogIn</h1>
			
			<form th:action="@{/login}" method="post">
				
				<div class="field">
					<input name="user-field" placeholder="Username" required>
					
					<div class="password-wrapper">
						<input name="password-field" id="password-field" placeholder="Password" type="password" required>
						<button id="password-eye-button" type="button" onclick="changeInputTypeAndSymbol()">
							<i class="bi bi-eye"></i>
						</button>
					</div>
				</div>
				
				<a class="forgot-link" href="#">Forgot Password?</a>
				
				<button class="logInButton" type="submit">LogIn</button>
				
				<p>Don't hava an account? <a href="#">Register</a></p>
			</form>
		</div>
		
		<script src="js/logInScripts/password-eye-script.js"></script>
	</body>
</html>
