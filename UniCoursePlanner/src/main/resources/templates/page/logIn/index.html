<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/logInStyle.css}">		
	</head>
	<body>
		<div class="logInContainer">
			<h1>LogIn</h1>
			
			<form th:action="@{/login}" method="post">
				
				<input type="hidden"  th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				
				<div class="field">
					<input name="user-field" placeholder="Username" required>
					
					<div class="password-wrapper">
						<input name="password-field" id="password-field" placeholder="Password" type="password" required>
						<button id="password-eye-button" type="button" onclick="changeInputTypeAndSymbol()">
							<i class="bi bi-eye"></i>
						</button>
					</div>
				</div>
				
				<div class="login-options">
				    <div class="remember-me">
				        <label>
				            <input type="checkbox" id="remember-me" name="remember-me">
				            Remember me
				        </label>
				    </div>

				    <a href="#">Forgot Password?</a>
				</div>
				
				<button class="button" type="submit">LogIn</button>
				
				<p>Don't hava an account? <a th:href="@{/page/logIn/register}">Register</a></p>
			</form>
			
			<div class="error hidden-feld" th:text="${error}"></div>
		</div>
		
		<script th:src="@{/js/logInScripts/password-eye-script.js}"></script>
		
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<script th:src="@{/js/logInScripts/error-message.js}"></script>
	</body>
</html>
