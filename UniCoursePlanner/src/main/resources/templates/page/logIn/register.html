<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/logIn/logInStyle.css}">
	</head>
	<body>
		<div class="logInContainer">
			<h1>Register</h1>
			
			<form th:action="@{/register}" method="post">
				
				<div class="field">
					<input name="user-field" placeholder="Username" required>
					
					<input name="email-field" placeholder="Email" type="email" required>
					
					<div class="password-wrapper">
						<input name="password-field" id="password-field" placeholder="Password" type="password" required>
						<button id="password-eye-button" type="button" onclick="changeInputTypeAndSymbol()">
							<i class="bi bi-eye"></i>
						</button>
					</div>
				</div>
				
				<button class="button" type="submit">Register</button>
			</form>
		</div>
		
		<script th:src="@{/js/logInScripts/password-eye-script.js}"></script>
	</body>
</html>
