<!DOCTYPE html>
<html>
	<head>
		<title>Uni-Course-Planner Passwort</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" th:href="@{/css/logInStyle.css}">
	</head>
	<body>
		<!-- Verification code form -->
		<div class="logInContainer">
			<h1>Passwort ändern</h1>
			
			<form th:action="@{/verifyCode}" method="post">
				
				<div class="field">
					<input name="code-field" type="text" placeholder="000000" maxlength="6" required>
				</div>
				
				<button class="button" type="submit">Email bestätigen</button>
			</form>
			
			<!-- Display error messages -->
			<div th:replace="~{fragments/core-fragments :: error-message}"></div>
		</div>
	</body>
</html>
