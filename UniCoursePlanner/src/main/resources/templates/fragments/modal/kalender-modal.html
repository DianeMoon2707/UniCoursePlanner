<div th:fragment="insert-mask">
	<h1>Neuen Kalendereintrag anlegen</h1>
	
	<form id="insertForm" th:action="@{/insert}" method="post" th:object="${fieldDTO}">
		<input type="hidden" name="insertType" th:value="${insertType}">
		
		<label>Datum: </label>
		<input type="text" th:field="*{date}" id="dateDTO" readonly> <br>
		
		<label>Zeit: </label>
		<input th:field="*{time}" type="time"> <br>
		
		<label>Event: </label>
		<input th:field="*{topic}" type="text"> <br>
		
		<label>Weitere Beschreibung: </label>
		<input th:field="*{extension}" type="text"> <br>
		
		<button>Speichern</button>
	</form>
	<script th:src="@{/js/kalenderScripts/date-transmission.js}"></script>
</div>

<div th:fragment="delete-mask">
	<h1>Modul löschen</h1>
	
	<form id="deleteForm" th:action="@{/delete}" method="post" th:object="${fieldDTO}">
		<input type="hidden" name="deleteType" th:value="${deleteType}">
		
		<h2>Standarddaten</h2>		
		<input type="hidden" th:field="*{modul_id}">
		
		<label>Modulname: </label>
		<input th:field="*{modulname}" type="text" readonly> <br>
		
		<label>Leistungspunkte: </label>
		<input th:field="*{lp}" readonly> <br>
		
		<h2>Veranstaltungsformen</h2>
		
		<div th:each="type : *{eventTypes}">
			<label th:text="${type.description}"></label>
			<input th:field="*{eventTypes}" type="checkbox" th:value="${type}">
		</div>
		
		<button>Löschen</button>
	</form>
</div>

<div th:fragment="edit-mask">
	<h1>Modul ändern</h1>
	
	<form id="editForm" th:action="@{/edit}" method="post" th:object="${fieldDTO}">
		<input type="hidden" name="editType" th:value="${editType}">
		
		<h2>Standarddaten</h2>		
		<input type="hidden" th:field="*{modul_id}">
		
		<label>Modulname: </label>
		<input th:field="*{modulname}" type="text" readonly> 
		<i class="bi bi-arrow-right"></i>
		<input th:field="*{modulnameNeu}" type="text"><br>
		
		<label>Leistungspunkte: </label>
		<input th:field="*{lp}" readonly>
		<i class="bi bi-arrow-right"></i>
		<input th:field="*{lpNeu}" type="number" min="0"> <br>
		
		<h2>Veranstaltungsformen</h2>
		
		<div th:each="type : ${T(com.uni_course_planner.constants.modul.EventTypes).values()}">
			<label th:text="${type.description}"></label>
			<input th:field="*{eventTypes}" type="checkbox" th:value="${type}"
			th:disabled="${fieldDTO.eventTypes != null and fieldDTO.eventTypes.contains(type)}">
		</div>
		
		<button>Ändern</button>
	</form>
</div>
