<div th:fragment="standard">	
	<p>
		Für deinen Stundenplan ist derzeit kein gültiger Zeitraum vorhanden.<br>
		Entweder wurde noch kein Zeitraum festgelegt oder der bisherige Zeitraum ist abgelaufen.<br>
		Bitte wähle unten ein Start- und Enddatum aus, für das der Stundenplan gelten soll.
	</p>
	
	<form th:action="@{/saveDate}" method="post">
		<div>
			<input type="date" name="validFrom" th:value="${today}">
			<i class="bi bi-arrow-right"></i>
			<input type="date" name="validTo" th:value="${later}">
		</div>
		
		<button>Stundenplan für diesen Zeitraum erstellen</button>
	</form>
</div>

<div th:fragment="timetable">				
	<div class="raster">
		<div>Montag</div>
		<div>Dienstag</div>
		<div>Mittwoch</div>
		<div>Donnerstag</div>
		<div>Freitag</div>
		
		<div>X</div>
		<div></div>
		<div>Y</div>
		<div></div>
		<div>Z</div>
	</div>
</div>
